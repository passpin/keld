[package]
name = "keld-native-llvm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["llvm"]
llvm = ["dep:llvm-sys"]

[dependencies]
llvm-sys = { version = "=221.0.1", optional = true, features = ["strict-versioning", "force-dynamic"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
