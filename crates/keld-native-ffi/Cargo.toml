[package]
name = "keld-native-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-controls = ["keld-native-runtime/test-controls"]

[lib]
name = "keld_runtime_v1"
crate-type = ["cdylib", "rlib"]

[dependencies]
keld-native-abi = { path = "../keld-native-abi" }
keld-native-runtime = { path = "../keld-native-runtime" }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
