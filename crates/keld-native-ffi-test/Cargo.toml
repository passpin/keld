[package]
name = "keld-native-ffi-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "keld_runtime_v1_test"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["test-controls"]
test-controls = []

[dependencies]
keld-native-abi = { path = "../keld-native-abi" }
keld-native-runtime = { path = "../keld-native-runtime", features = ["test-controls"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
