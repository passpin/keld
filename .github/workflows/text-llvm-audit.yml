name: Text IR Diagnostic

on:
  push:
    branches: [perf/text-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Diagnose generated Text IR
        run: cargo test -p keld-ir --test text_content_ir -- --nocapture
