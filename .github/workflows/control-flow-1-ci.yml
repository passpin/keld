name: Control Flow 1 CI

on:
  push:
    branches:
      - feature/control-flow-1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply queued edit and record failure
        id: patch
        shell: bash
        run: |
          if [ ! -f .control-flow-apply.py ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python3 .control-flow-apply.py > .control-flow-patch-last.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> .control-flow-patch-last.txt

          if [ "$status" -ne 0 ]; then
            git add .control-flow-patch-last.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record Control Flow-1 edit failure [skip ci]"
            git push
            exit "$status"
          fi

          git rm .control-flow-apply.py
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Run Task 3 full lifecycle gate
        shell: bash
        run: |
          set +e
          (
            cargo test -p keld-lifecycle
            first=$?
            cargo test -p keld-flow
            second=$?
            if [ "$first" -ne 0 ]; then exit "$first"; fi
            exit "$second"
          ) > .control-flow-ci-last.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> .control-flow-ci-last.txt

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record Control Flow-1 verification [skip ci]"
            git push
          fi

          exit "$status"
