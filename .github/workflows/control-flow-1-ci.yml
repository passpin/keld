name: Control Flow 1 CI

on:
  push:
    branches: [feature/control-flow-1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run focused final gate
        shell: pwsh
        run: |
          $log = '.control-flow-ci-last.txt'
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:CARGO_BUILD_TARGET = 'x86_64-pc-windows-gnu'
          $env:KELD_MINGW_GCC = 'C:\mingw64\bin\gcc.exe'
          $env:KELD_DLLTOOL = 'C:\mingw64\bin\dlltool.exe'
          rustup target add x86_64-pc-windows-gnu *>> $log
          & C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm mingw-w64-x86_64-llvm mingw-w64-x86_64-llvm-tools" *>> $log
          $env:LLVM_SYS_221_PREFIX = 'C:\msys64\mingw64'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $llvm = (& "$env:LLVM_SYS_221_PREFIX\bin\llvm-config.exe" --version).Trim()
          "llvm=$llvm" | Out-File $log -Append
          $setup = if ($llvm -eq '22.1.8') { 0 } else { 1 }

          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu *>> $log; $prod=$LASTEXITCODE
          cargo build -p keld-native-ffi-test --release --target x86_64-pc-windows-gnu *>> $log; $test=$LASTEXITCODE
          $artifacts=0
          foreach ($p in @('keld_runtime_v1.dll','libkeld_runtime_v1.dll.a','keld_runtime_v1_test.dll','libkeld_runtime_v1_test.dll.a')) {
            if (-not (Test-Path "target\x86_64-pc-windows-gnu\release\$p")) { $artifacts=1 }
          }

          cargo test -p keld-semantics *>> $log; $semantics=$LASTEXITCODE
          cargo test -p keld-flow *>> $log; $flow=$LASTEXITCODE
          cargo test -p keld-lifecycle *>> $log; $lifecycle=$LASTEXITCODE
          cargo test -p keld-storage *>> $log; $storage=$LASTEXITCODE
          cargo test -p keld-ir *>> $log; $ir=$LASTEXITCODE
          cargo test -p keld-interpreter *>> $log; $interpreter=$LASTEXITCODE
          cargo test -p keld-native-backend --test differential -- --nocapture *>> $log; $diff=$LASTEXITCODE
          cargo test -p keld-native-backend --test native_int -- --nocapture *>> $log; $native=$LASTEXITCODE
          cargo test -p keld-native-backend --test surface_audit -- --nocapture *>> $log; $surface=$LASTEXITCODE
          cargo test -p keld-cli --test cli --test milestone_acceptance *>> $log; $cli=$LASTEXITCODE

          "setup=$setup prod=$prod test_runtime=$test artifacts=$artifacts semantics=$semantics flow=$flow lifecycle=$lifecycle storage=$storage ir=$ir interpreter=$interpreter differential=$diff native_int=$native surface=$surface cli=$cli" | Out-File $log -Append
          $status = if (@($setup,$prod,$test,$artifacts,$semantics,$flow,$lifecycle,$storage,$ir,$interpreter,$diff,$native,$surface,$cli) -contains 1) { 1 } else { 0 }
          "exit_status=$status" | Out-File $log -Append

          git add .control-flow-ci-last.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record focused Control Flow-1 final gate [skip ci]"
          git push
          exit $status
