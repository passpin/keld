name: Control Flow 1 CI

on:
  push:
    branches: [feature/control-flow-1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run plan-exact final gate
        shell: pwsh
        run: |
          $log = '.control-flow-ci-last.txt'
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:CARGO_BUILD_TARGET = 'x86_64-pc-windows-gnu'
          $env:KELD_MINGW_GCC = 'C:\mingw64\bin\gcc.exe'
          $env:KELD_DLLTOOL = 'C:\mingw64\bin\dlltool.exe'

          rustup target add x86_64-pc-windows-gnu *>> $log
          rustup component add clippy rustfmt *>> $log
          & C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm mingw-w64-x86_64-llvm mingw-w64-x86_64-llvm-tools" *>> $log
          $env:LLVM_SYS_221_PREFIX = 'C:\msys64\mingw64'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $llvm = (& "$env:LLVM_SYS_221_PREFIX\bin\llvm-config.exe" --version).Trim()
          "llvm=$llvm" | Out-File $log -Append
          $setup = if ($llvm -eq '22.1.8') { 0 } else { 1 }

          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu *>> $log; $prod=$LASTEXITCODE
          cargo build -p keld-native-ffi-test --release --target x86_64-pc-windows-gnu *>> $log; $testRuntime=$LASTEXITCODE
          $artifacts=0
          foreach ($p in @('keld_runtime_v1.dll','libkeld_runtime_v1.dll.a','keld_runtime_v1_test.dll','libkeld_runtime_v1_test.dll.a')) {
            if (-not (Test-Path "target\x86_64-pc-windows-gnu\release\$p")) { $artifacts=1 }
          }

          cargo test --workspace --all-targets --no-fail-fast *>> $log; $debug=$LASTEXITCODE
          cargo test --workspace --all-targets --release --no-fail-fast *>> $log; $release=$LASTEXITCODE
          cargo clippy --workspace --all-targets -- -D warnings *>> $log; $clippy=$LASTEXITCODE
          cargo fmt --all -- --check *>> $log; $fmt=$LASTEXITCODE
          git diff --check *>> $log; $diffcheck=$LASTEXITCODE

          $interpreterLoop = (& cargo run --release -q -p keld-cli -- run --engine interpreter crates/keld-cli/tests/fixtures/control_flow_loop.keld 2>> $log) -join "`n"
          $interpreterLoopStatus=$LASTEXITCODE
          $nativeLoop = (& cargo run --release -q -p keld-cli -- run --engine native crates/keld-cli/tests/fixtures/control_flow_loop.keld 2>> $log) -join "`n"
          $nativeLoopStatus=$LASTEXITCODE
          $interpreterAlloc = (& cargo run --release -q -p keld-cli -- run --engine interpreter crates/keld-cli/tests/fixtures/control_flow_allocations.keld 2>> $log) -join "`n"
          $interpreterAllocStatus=$LASTEXITCODE
          $nativeAlloc = (& cargo run --release -q -p keld-cli -- run --engine native crates/keld-cli/tests/fixtures/control_flow_allocations.keld 2>> $log) -join "`n"
          $nativeAllocStatus=$LASTEXITCODE
          $dump = (& cargo run --release -q -p keld-cli -- dump-ir crates/keld-cli/tests/fixtures/control_flow_loop.keld 2>> $log) -join "`n"
          $dumpStatus=$LASTEXITCODE

          $smoke = 0
          if ($interpreterLoopStatus -ne 0 -or $nativeLoopStatus -ne 0 -or $interpreterAllocStatus -ne 0 -or $nativeAllocStatus -ne 0 -or $dumpStatus -ne 0) { $smoke = 1 }
          if ($interpreterLoop.Trim() -ne '8' -or $nativeLoop.Trim() -ne '8' -or $interpreterAlloc.Trim() -ne '6' -or $nativeAlloc.Trim() -ne '6' -or [string]::IsNullOrWhiteSpace($dump)) { $smoke = 1 }
          "smoke interpreter_loop='$interpreterLoop' native_loop='$nativeLoop' interpreter_alloc='$interpreterAlloc' native_alloc='$nativeAlloc' dump_chars=$($dump.Length)" | Out-File $log -Append

          "setup=$setup prod=$prod test_runtime=$testRuntime artifacts=$artifacts workspace_debug=$debug workspace_release=$release clippy=$clippy fmt=$fmt diffcheck=$diffcheck smoke=$smoke" | Out-File $log -Append
          $values = @($setup,$prod,$testRuntime,$artifacts,$debug,$release,$clippy,$fmt,$diffcheck,$smoke)
          $status = if ($values | Where-Object { $_ -ne 0 }) { 1 } else { 0 }
          "exit_status=$status" | Out-File $log -Append

          git add .control-flow-ci-last.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record plan-exact Control Flow-1 final gate [skip ci]"
          git push
          exit $status
