name: Control Flow 1 CI

on:
  push:
    branches:
      - feature/control-flow-1

permissions:
  contents: write

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply queued patch
        shell: bash
        run: |
          if [ -f .control-flow-apply.patch ]; then
            git apply --index .control-flow-apply.patch
            git rm .control-flow-apply.patch
          fi

      - name: Run semantics tests and record result
        shell: bash
        run: |
          set +e
          cargo test -p keld-semantics > .control-flow-ci-last.txt 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> .control-flow-ci-last.txt

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: record Control Flow-1 verification [skip ci]"
            git push
          fi

          exit "$status"
