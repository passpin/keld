name: Native-1 ordinary COFF verification

on:
  pull_request:
    branches:
      - feature/custody-ledger-bootstrap
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Rust and GNU target
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt clippy
          rustup target add x86_64-pc-windows-gnu --toolchain 1.97.0
          rustup default 1.97.0

      - name: Bootstrap pinned LLVM and locate MinGW tools
        run: |
          $ErrorActionPreference = 'Stop'
          $lockPath = '.tools\llvm\llvm-packages.lock.json'
          $lockText = Get-Content -Raw -LiteralPath $lockPath
          $lockText = $lockText.Replace('https://mirror.msys2.org/', 'https://repo.msys2.org/')
          Set-Content -LiteralPath $lockPath -Value $lockText -NoNewline
          $prefix = (& .\scripts\bootstrap-llvm.ps1 | Select-Object -Last 1).Trim()
          $llvmBin = Join-Path $prefix 'bin'
          $mingwBin = 'C:\msys64\mingw64\bin'
          $env:PATH = "$llvmBin;$mingwBin;$env:PATH"
          "LLVM_SYS_221_PREFIX=$prefix" >> $env:GITHUB_ENV
          $llvmBin >> $env:GITHUB_PATH
          if (Test-Path -LiteralPath $mingwBin) {
            $mingwBin >> $env:GITHUB_PATH
          }
          $gcc = (Get-Command gcc.exe -ErrorAction Stop).Source
          $dlltool = (Get-Command dlltool.exe -ErrorAction Stop).Source
          $ar = (Get-Command ar.exe -ErrorAction Stop).Source
          "KELD_MINGW_GCC=$gcc" >> $env:GITHUB_ENV
          "KELD_DLLTOOL=$dlltool" >> $env:GITHUB_ENV
          "KELD_AR=$ar" >> $env:GITHUB_ENV
          & (Join-Path $llvmBin 'llvm-config.exe') --version
          & $gcc --version
          & $dlltool --version
          & $ar --version

      - name: Build Native-1 runtime artifacts
        run: |
          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu
          Copy-Item -LiteralPath target\x86_64-pc-windows-gnu\release\keld_runtime_v1.dll -Destination target\x86_64-pc-windows-gnu\release\keld_runtime_v1.normal.dll -Force
          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu --features test-controls
          Copy-Item -LiteralPath target\x86_64-pc-windows-gnu\release\keld_runtime_v1.dll -Destination target\x86_64-pc-windows-gnu\release\keld_runtime_v1_test.dll -Force
          Copy-Item -LiteralPath target\x86_64-pc-windows-gnu\release\keld_runtime_v1.normal.dll -Destination target\x86_64-pc-windows-gnu\release\keld_runtime_v1.dll -Force

      - name: RED - ordinary COFF runtime definition is accepted before fix
        run: |
          python .github/native1-fix-helper.py add-test
          cargo fmt --all
          $output = @(cargo test -p keld-native-backend --target x86_64-pc-windows-gnu --test native_int ordinary_coff_runtime_symbol_override_is_rejected -- --exact 2>&1)
          $exit = $LASTEXITCODE
          $text = $output | Out-String
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -eq 0) {
            throw 'RED regression unexpectedly passed before the production fix.'
          }
          if ($text -notmatch 'ordinary COFF runtime symbol override must be rejected') {
            throw 'RED failed for an unrelated reason instead of reproducing the validator gap.'
          }
          Write-Host 'RED confirmed: the current validator accepts the ordinary COFF runtime definition.'

      - name: Apply minimal validator fix
        run: |
          python .github/native1-fix-helper.py apply-fix
          cargo fmt --all

      - name: GREEN - targeted regression
        run: cargo test -p keld-native-backend --target x86_64-pc-windows-gnu --test native_int ordinary_coff_runtime_symbol_override_is_rejected -- --exact

      - name: Native backend regression suite
        run: cargo test -p keld-native-backend --target x86_64-pc-windows-gnu --tests

      - name: Workspace debug tests
        run: cargo test --workspace --all-targets --target x86_64-pc-windows-gnu

      - name: Workspace release tests
        run: cargo test --workspace --all-targets --release --target x86_64-pc-windows-gnu

      - name: Clippy, formatting, and diff checks
        run: |
          cargo clippy --workspace --all-targets --all-features --target x86_64-pc-windows-gnu -- -D warnings
          cargo fmt --all -- --check
          git checkout -- .tools/llvm/llvm-packages.lock.json
          git diff --check
