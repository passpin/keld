name: Apply Cyclic Home Dataflow Fix

on:
  push:
    branches: [perf/text-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/text-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Apply fixed-point correction
        run: |
          python .home-dataflow-fix.py
          cargo fmt --all
      - name: Verify focused regression
        run: cargo test -p keld-ir --test text_content_ir -- --nocapture
      - name: Verify IR suite
        run: cargo test -p keld-ir --tests
      - name: Strict Clippy
        run: cargo clippy -p keld-ir --tests -- -D warnings
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet -- crates/keld-ir/src/validate.rs; then
            echo "No dataflow changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/keld-ir/src/validate.rs
          git commit -m "fix: solve cyclic Home states from unknown bottom"
          git push origin HEAD:perf/text-runtime
