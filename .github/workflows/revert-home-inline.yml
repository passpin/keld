name: Revert Weak Home Inline Experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  revert:
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
      LLVM_SYS_221_PREFIX: C:\msys64\mingw64
      KELD_MINGW_GCC: C:\mingw64\bin\gcc.exe
      KELD_DLLTOOL: C:\mingw64\bin\dlltool.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/text-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-gnu
          components: clippy,rustfmt
      - name: Restore pre-experiment backend
        shell: bash
        run: |
          git fetch --depth=1 origin 3c3731a92e76954269e0bec4aae3f92f113dfa9e
          git checkout FETCH_HEAD -- crates/keld-native-backend/src/lib.rs
      - name: Install pinned LLVM runtime
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-llvm-tools"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 LLVM install failed" }
          $version = (& "$env:LLVM_SYS_221_PREFIX\bin\llvm-config.exe" --version).Trim()
          if ($version -ne "22.1.8") { throw "expected LLVM 22.1.8, got $version" }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native runtimes
        shell: pwsh
        run: |
          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p keld-native-ffi-test --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained production boundary
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test production_test_site -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve differential and native behavior
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test differential -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p keld-native-backend --release --test native_int -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Architecture and lint gates
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test architecture -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p keld-native-backend --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit revert
        shell: bash
        run: |
          if git diff --quiet -- crates/keld-native-backend/src/lib.rs; then
            echo "No backend revert to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/keld-native-backend/src/lib.rs
          git commit -m "perf: drop weak Home bookkeeping inline experiment"
          git push origin HEAD:perf/text-runtime
