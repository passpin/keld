name: Native-1 run observer

on:
  push:
    branches:
      - fix/native1-ordinary-coff-runtime-override-v2

permissions:
  issues: write

jobs:
  observe:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Report trigger to PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{ body = "Native-1 observer triggered for ``$env:GITHUB_SHA`` on Windows." } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/passpin/keld/issues/3/comments' -Headers $headers -ContentType 'application/json' -Body $body
