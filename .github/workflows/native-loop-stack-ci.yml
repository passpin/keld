name: Native Alloca Hoist Verification

on:
  push:
    branches: [fix/native-loop-alloca-hoist]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
      LLVM_SYS_221_PREFIX: C:\msys64\mingw64
      KELD_MINGW_GCC: C:\mingw64\bin\gcc.exe
      KELD_DLLTOOL: C:\mingw64\bin\dlltool.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-gnu
          components: clippy,rustfmt
      - name: Install pinned LLVM runtime
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-llvm-tools"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 LLVM install failed" }
          $version = (& "$env:LLVM_SYS_221_PREFIX\bin\llvm-config.exe" --version).Trim()
          if ($version -ne "22.1.8") { throw "expected LLVM 22.1.8, got $version" }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build production runtime
        shell: pwsh
        run: |
          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run 500k loop stack regression
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test loop_stack_regression -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native backend release suite
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --all-targets --no-fail-fast -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict Clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rustfmt check
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
