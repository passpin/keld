name: Apply Production Test-Site Split

on:
  push:
    branches: [perf/text-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
      LLVM_SYS_221_PREFIX: C:\msys64\mingw64
      KELD_MINGW_GCC: C:\mingw64\bin\gcc.exe
      KELD_DLLTOOL: C:\mingw64\bin\dlltool.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/text-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-gnu
          components: clippy,rustfmt
      - name: Install pinned LLVM runtime
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-llvm mingw-w64-x86_64-llvm-tools"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 LLVM install failed" }
          $version = (& "$env:LLVM_SYS_221_PREFIX\bin\llvm-config.exe" --version).Trim()
          if ($version -ne "22.1.8") { throw "expected LLVM 22.1.8, got $version" }
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: RED - production codegen still emits test-site calls
        shell: pwsh
        run: |
          python .test-site-red.py
          cargo fmt --all
          cargo test -p keld-native-backend --lib production_ir_has_no_test_site_calls -- --nocapture
          if ($LASTEXITCODE -eq 0) { throw "RED unexpectedly passed" }
          Write-Host "RED confirmed: production IR still contains test-site calls"
      - name: Apply production/test-control codegen split
        shell: pwsh
        run: |
          python .test-site-green.py
          cargo fmt --all
      - name: GREEN - production test-site regression
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --lib production_ir_has_no_test_site_calls -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native runtimes
        shell: pwsh
        run: |
          cargo build -p keld-native-ffi --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p keld-native-ffi-test --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve differential allocation-site semantics
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test differential -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p keld-native-backend --release --test native_int -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Architecture boundary
        shell: pwsh
        run: |
          cargo test -p keld-native-backend --release --test architecture -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict Clippy and format
        shell: pwsh
        run: |
          cargo clippy -p keld-native-backend --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit split
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No code changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "perf: omit test-control sites from production native code"
          git push origin HEAD:perf/text-runtime
