name: Apply Text LLVM Audit

on:
  push:
    branches: [perf/text-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/text-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply audit test
        run: |
          python .text-ir-audit-patch.py
          cargo fmt --all
      - name: Commit audit
        shell: bash
        run: |
          if git diff --quiet -- crates/keld-native-backend/src/lib.rs; then
            echo "No audit changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/keld-native-backend/src/lib.rs
          git commit -m "test: audit Text runtime calls in generated LLVM"
          git push origin HEAD:perf/text-runtime
