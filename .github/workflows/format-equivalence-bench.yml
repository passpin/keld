name: Format Equivalence Benchmark

on:
  push:
    branches: [bench/equivalence-performance]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/equivalence-performance
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Format benchmark tests
        run: cargo fmt --all
      - name: Commit formatted benchmark files
        shell: bash
        run: |
          if git diff --quiet -- crates/keld-native-backend/tests/equivalence_matrix.rs crates/keld-native-backend/tests/language_runtime_compare.rs; then
            echo "No benchmark formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/keld-native-backend/tests/equivalence_matrix.rs crates/keld-native-backend/tests/language_runtime_compare.rs
          git commit -m "style: format equivalence benchmark harness"
          git push origin HEAD:bench/equivalence-performance
