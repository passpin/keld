name: IR Local Contract Review

on:
  push:
    branches: [fix/ir-local-validator-contract]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ir-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - name: Run keld-ir regression suite
        run: cargo test -p keld-ir --all-targets --no-fail-fast
      - name: Run strict Clippy
        run: cargo clippy -p keld-ir --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
