name: IR Local Contract Review

on:
  push:
    branches: [fix/ir-local-validator-contract]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ir-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - name: Apply reviewed validator fix
        if: github.event_name == 'push' && hashFiles('.ir-local-contract-apply.py') != ''
        run: |
          python .ir-local-contract-apply.py
          cargo fmt --all
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden IR local register validation"
          git push
      - name: Run adversarial IR validator tests
        run: cargo test -p keld-ir --test review_adversarial -- --nocapture
